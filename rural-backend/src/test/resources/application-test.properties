# Application
spring.application.name=${SPRING_APPLICATION_NAME:rural-backend-test}
server.port=${SERVER_PORT:0}

# Database (H2)
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.h2.console.enabled=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:create-drop}
spring.jpa.show-sql=${HIBERNATE_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.defer-datasource-initialization=${HIBERNATE_DEFER_INIT:true}

# Logging
logging.level.root=${LOGGING_LEVEL_ROOT:WARN}
logging.level.com.aogdev.rural=${LOGGING_LEVEL_APP:INFO}
logging.level.org.springframework.web=${LOGGING_LEVEL_WEB:WARN}
logging.level.org.hibernate=${LOGGING_LEVEL_HIBERNATE:WARN}

# Security
spring.security.user.name=${SECURITY_USER_NAME:test}
spring.security.user.password=${SECURITY_USER_PASSWORD:test}